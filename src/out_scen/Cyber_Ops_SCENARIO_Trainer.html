<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Ops Scenario Trainer</title><style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e8eaf0;--mut:#9aa3b2;--acc:#4f9cff;--ok:#2fbf71;--bad:#ff5c6c}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:#12141a;border-bottom:1px solid var(--line);padding:10px 16px;z-index:5}
h1{font-size:17px;margin:0 0 8px}nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);border-color:var(--acc);color:#07101f;font-weight:600}
main{max-width:860px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.q{font-size:19px;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px}
.opt.correct{background:rgba(47,191,113,.18);border-color:var(--ok)}.opt.wrong{background:rgba(255,92,108,.16);border-color:var(--bad)}
.exp{color:var(--mut);font-size:14px;border-left:3px solid var(--acc);padding-left:10px;margin-top:12px;white-space:pre-wrap}
.ans{background:#10131a;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.pill{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.bar{height:7px;background:#20242e;border-radius:99px;overflow:hidden;margin:10px 0}.bar>i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;font-size:14px}
label.dk{display:flex;gap:8px;align-items:flex-start;padding:7px;border-bottom:1px solid var(--line);font-size:14px}
textarea{width:100%;min-height:90px;background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.small{font-size:13px;color:var(--mut)}.big{font-size:28px;font-weight:700}
</style></head><body>
<header><h1>Cyber Ops Scenario Trainer <span class="pill" id="count"></span></h1>
<nav><button data-v="study" class="on">Study</button><button data-v="decks">Pick chapters</button><button data-v="plan">10-day plan</button><button data-v="browse">Browse all</button></nav></header>
<main id="app"></main>

const DECKS=[{"code": "SA", "name": "Metasploit & Meterpreter - Scenarios (Ch.1-7)", "book": "Metasploit & Meterpreter", "questions": [{"type": "mc", "q": "A scanner reports a server has CVE-2024-1234 with a CVSS of 9.8, and a second server with no CVEs but admins log in over plain telnet with a shared password. Which do you worry about, and why?", "options": ["Both - the misconfigured telnet box is at least as dangerous, and attackers often prefer misconfigs since they need no exploit and raise no alert", "Only the CVE box - a high CVSS always wins", "Only the telnet box - CVEs are never exploited", "Neither - no CVE means no risk"], "answer": 0, "exp": "Ch.1: misconfigurations are at least as important as CVEs and are often preferred. CVE = the bug's name, CVSS = its 0-10 score."}, {"type": "mc", "q": "You have valid administrator credentials for a fully patched, properly configured Windows box. Can Metasploit still get you in?", "options": ["No - patching blocks all Metasploit access", "Yes - known admin creds let Metasploit give you a Meterpreter shell even on a hardened box", "Only if there's an unpatched CVE", "Only over the physical console"], "answer": 1, "exp": "Ch.1: credentials beat configuration. This is the whole setup for the book."}, {"type": "mc", "q": "You land a Meterpreter session but 'getuid' shows a low-privileged user. What's true about what you can do and where you can go?", "options": ["What you can see depends on your process's privileges, and you can migrate from a higher-privileged process down to lower ones", "Meterpreter can't do recon until you're admin", "You can migrate from low privilege up to SYSTEM for free", "You automatically have SYSTEM"], "answer": 0, "exp": "Ch.2: data available depends on the host process's privileges; migration goes high->low. Meterpreter lives in a process in memory, which is why file scanning misses it."}, {"type": "sa", "q": "Scenario: your lure is a tiny buffer overflow with almost no room for code, and later you phish a laptop on flaky hotel wifi that may drop after one connection. Which payload type for each, and why?", "answer": "Tiny space -> STAGED (small stub downloads the rest). Flaky one-shot network -> STAGELESS (whole payload ships at once, needs no second connection).", "exp": "Ch.3 exam favorite. Name tell: slash = staged (meterpreter/reverse_tcp), underscore = stageless (meterpreter_reverse_tcp)."}, {"type": "mc", "q": "Your payload needs to call home through a corporate firewall that blocks inbound connections. Bind or reverse?", "options": ["Either works equally", "Neither works through a firewall", "Reverse - the target connects out to you (LHOST/LPORT), and outbound is usually allowed", "Bind - the target listens and you connect in"], "answer": 2, "exp": "Ch.3: reverse beats firewalls/NAT. A handler catches the callback; run it as a job (exploit -j) in the background."}, {"type": "sa", "q": "You need to brute force one service and have limited time. The book says which targets/services are faster, and what 4 things define the attack?", "answer": "Windows is faster than Linux, and SMB is faster than SSH (Windows Wins, SMB is Speedy). The 4 features: userlist, wordlist, time, defenses (Users Want Time Delays).", "exp": "Ch.4. Modules: smb_login and ssh_login. Defenses = lockout, rate limiting, MFA, strong passwords."}, {"type": "mc", "q": "You phish a user and they type the WRONG password into your fake Windows prompt. What happens with phish_windows_credentials?", "options": ["It accepts anything and logs the wrong password", "It locks the account", "It keeps re-prompting until the credentials actually validate against the system", "It crashes"], "answer": 2, "exp": "Ch.5: that re-prompt is why it works. You can run it from an UNPRIVILEGED session to steal the logged-on user's domain/local creds."}, {"type": "mc", "q": "You generated a payload and ran it through Metasploit encoders several times, but Defender still catches it. Why?", "options": ["The payload was corrupted", "You didn't encode enough times", "Encoding only works on Linux", "Encoders dodge bad characters, not AV - modern AV watches behavior, memory and the cloud"], "answer": 3, "exp": "Ch.6/7: encoding != evasion. Whether malware runs depends on the target's AV; Windows ships Defender."}, {"type": "sa", "q": "You want to trojanize a real program so the victim sees normal behavior. Which tool and flags, and what does static vs dynamic analysis mean for the defender?", "answer": "msfvenom with -x <real program> -k (keep it working), plus -p payload, -f format, -o outfile. Static = examine without running (strings, hashes, Ghidra). Dynamic = run and watch (strace, gdb).", "exp": "Ch.6."}, {"type": "mc", "q": "You're admin on a box with Defender tamper protection ON. You can't disable Defender - what's your move for a lasting blind spot?", "options": ["Disable Defender in the registry (still supported)", "Add an exclusion - excluded paths/processes are never scanned, and admins can still add them even with tamper protection on", "Empty the quarantine", "Nothing - tamper protection stops everything"], "answer": 1, "exp": "Ch.7: this is the key nuance. Quarantined threats can also be restored; registry-disable is no longer supported."}]}, {"code": "SB", "name": "Linux for Cyber Ops - Scenarios (Ch.1-8)", "book": "Linux", "questions": [{"type": "mc", "q": "You get a Linux shell and want your commands left out of history, and you notice '.' is early in the user's PATH. What do these two facts give you?", "options": ["Nothing useful", "Only history matters, PATH is harmless", "Only PATH matters, history can't be cleared", "Hide tracks (unset HISTFILE / HISTSIZE=0 / set +o history) and hijack a command by dropping a fake binary that '.' in PATH runs first"], "answer": 3, "exp": "Ch.1: PATH is THE security env var; attackers also suppress bash history. A shell also behaves differently by how it's started (login vs not)."}, {"type": "sa", "q": "You find a second account in /etc/passwd with UID 0, and another account whose hash in /etc/shadow starts with '!'. What does each mean?", "answer": "UID 0 = root, so that second account is a hidden root backdoor (Linux authorizes by UID, not name). '!' in front of the hash = the account is locked.", "exp": "Ch.2. Account files: passwd, shadow, group, gshadow. Expired password = change at login; expired account = can't log in at all."}, {"type": "mc", "q": "You crack a hash from /etc/shadow that starts with $6$. What is it, and how did John get the password?", "options": ["MD5, reversed mathematically", "Plaintext already", "bcrypt, decrypted with the salt", "SHA-512, found by repeated guessing (hash a guess, compare) - hashes are one-way, not reversible"], "answer": 3, "exp": "Ch.3: $1$=MD5, $5$=SHA-256, $6$=SHA-512, $y$=yescrypt. Salt = same password hashes differently per account, so rainbow tables fail."}, {"type": "mc", "q": "You can edit the sshd PAM stack. How do you get a shell on every SSH login attempt, even failed ones?", "options": ["Change the login shell", "Add pam_exec.so - it runs your program during authentication regardless of success", "Delete /etc/shadow", "Add pam_pwhistory.so"], "answer": 1, "exp": "Ch.3: pam_exec.so is the abuse; admins and attackers with privilege can edit PAM (/etc/pam.d)."}, {"type": "sa", "q": "An attacker logged in via SSH and wiped one login record, but you still caught the login. Name the 3 record systems and why wiping one isn't enough.", "answer": "utmp (who/w/last), lastlog (pam_lastlog.so), systemd (loginctl). Different programs write each, so scrubbing one leaves the login in the others.", "exp": "Ch.4 (U-L-S). sudo is configured in /etc/sudoers via visudo; Polkit = elevation for the GUI."}, {"type": "mc", "q": "You see a process named 'nginx' using 100% CPU but the box doesn't run a web server. How do you confirm it's really an attacker's renamed binary?", "options": ["Check /proc/<pid>/exe - it points at the real file on disk no matter what the process is named", "Reboot and see if it returns", "You can't - the name is authoritative", "Check its PID number"], "answer": 0, "exp": "Ch.5: defenders hunt by name, so attackers rename; /proc/<pid>/exe defeats it. Talk to a process with signals: SIGKILL(9) can't be caught, SIGTERM(15) can."}, {"type": "mc", "q": "An attacker wants persistence that survives reboot on a systemd box. Where do they put it, and where do you look?", "options": ["Nowhere - systemd can't persist malware", "A malicious .service unit or timer in /etc/systemd/system; check systemctl list-unit-files --state=enabled and list-timers", "In /tmp only", "In bash history"], "answer": 1, "exp": "Ch.5: systemd is PID 1; admins and attackers both use it. "}, {"type": "sa", "q": "You locked yourself out of a Linux box (lost root password) and separately find a SUID-root binary you don't recognize. What can you do with each?", "answer": "Lost password: boot rescue/install media, mount the disk, chroot in, reset with passwd. Unknown SUID-root (find / -perm -4000): runs as root, so it's a privilege-escalation path or a planted backdoor shell.", "exp": "Ch.6. SUID=run as owner, SGID=as group, sticky=only owner deletes (/tmp). Hard link=same inode; symlink=a path that breaks if target goes."}, {"type": "mc", "q": "A Red Hat box runs SELinux; an Ubuntu box runs AppArmor. One-line difference, and can both run at once?", "options": ["Both only log, never block", "SELinux = labels on everything, deny-by-default, tuned with Booleans; AppArmor = one profile per critical program; generally only one is active", "They're identical and always run together", "AppArmor labels everything; SELinux uses profiles"], "answer": 1, "exp": "Ch.7: SELinux context = user:role:type:level (U aRe Totally Locked). Modes: enforcing/permissive/disabled; aa-logprof fixes an AppArmor profile from denials."}, {"type": "mc", "q": "You're told to make sure software on a Linux fleet is trustworthy. What two things matter most?", "options": ["Nothing after install", "Only that apt is used", "Only the file names", "Repositories are valid (signed with trusted GPG keys) and installed files still match their package hashes (rpm -V, debsums)"], "answer": 3, "exp": "Ch.8: apt=Debian/Ubuntu/Mint, dnf/yum=Red Hat/Rocky, zypper=SUSE. Snap/Flatpak bundle dependencies (but publisher patches them, not the distro)."}]}, {"code": "SC", "name": "Windows for Cyber Ops - Scenarios (Ch.1-8)", "book": "Windows", "questions": [{"type": "mc", "q": "In a log you see powershell.exe launched with -EncodedCommand and a long Base64 string. What is happening, and why do attackers do it?", "options": ["A normal Windows update", "An obfuscated PowerShell command - Base64 hides keywords from simple command-line matching", "A corrupted command", "PowerShell being disabled"], "answer": 1, "exp": "Ch.1: Base64 and downloaded modules are the two obfuscation methods. PowerShell is the modern shell (runs on Linux too); cmd runs a registry AutoRun at startup and keeps history."}, {"type": "mc", "q": "You get cmd.exe to open and your command runs every time - you added a value in the registry. Which, and why do attackers like it?", "options": ["An environment variable", "The Command Processor AutoRun value - quiet user-level persistence inside a trusted program", "The Run key only works for PowerShell", "A scheduled task"], "answer": 1, "exp": "Ch.1: cmd executes AutoRun from the registry on startup."}, {"type": "mc", "q": "A domain group and a local group have the same name. A user is in the domain group - are they in the local group too?", "options": ["Yes, same name means same group", "Only on domain controllers", "No - different groups with different SIDs; domain membership doesn't grant local membership", "Only if they share a RID"], "answer": 2, "exp": "Ch.2: SIDs identify users/groups; well-known ones (S-1-5-18=SYSTEM, RID 500=Administrator) are the same everywhere. Local data=SAM, domain data=Active Directory."}, {"type": "sa", "q": "You dumped NTLM hashes but can't crack them in time. How do you still use them, and where did they come from?", "answer": "Pass-the-hash: use the hash itself to authenticate instead of the password. They live in the SAM (local) and ntds.dit (domain); protected so even SYSTEM can't read them directly - you pull them as Administrator or Backup Operator.", "exp": "Ch.3. Logon gives a login ID + access tokens; UAC lets you use a privileged token, controlled by registry/group policy."}, {"type": "mc", "q": "You download a flagged payload but want it to dodge the extra scrutiny Windows gives internet files. What do you do?", "options": ["Zip it with a password only", "Nothing can avoid it", "Rename the .exe", "Ship it inside a .iso or .vhd - those containers avoid the Mark of the Web"], "answer": 3, "exp": "Ch.4: MOTW is stored in an NTFS alternate data stream (Zone.Identifier); copying to FAT32 also strips it. Windows files also have 8.3 short names and several timestamps."}, {"type": "sa", "q": "At a locked Windows login screen you press Shift 5 times and get a SYSTEM command prompt. What attack is this, what made it possible, and what defends against it?", "answer": "Sticky Keys attack: you took ownership of sethc.exe (via SeTakeOwnershipPrivilege/SeRestorePrivilege) and replaced it with cmd.exe. Windows Resource Protection defends against it.", "exp": "Ch.5. Security descriptor = Owner, Group, DACL, SACL, Flags (Only Good Dogs Sit First). DACL=access (Door), SACL=logging (Security camera)."}, {"type": "mc", "q": "You want to see who can modify a service's files or a registry key. Which tools show the security properties/permissions?", "options": ["Only Task Manager", "icacls and Get-Acl, plus Sysinternals AccessChk/AccessEnum", "Only File Explorer (it's always accurate)", "Only regedit"], "answer": 1, "exp": "Ch.5: File Explorer works but has subtle issues; SDDL = permissions as a string. Registry keys and values are securable objects with their own DACL (Ch.6)."}, {"type": "mc", "q": "You see svchost.exe whose parent process is winword.exe, not services.exe. Why is that a red flag, and what trick might hide it?", "options": ["It's always normal", "svchost has no parent", "Word always launches svchost", "svchost should be a child of services.exe - an odd parent signals injection/masquerade; attackers can spoof (obfuscate) a process's parent"], "answer": 3, "exp": "Ch.7: defenders check the parent; attackers spoof it. Integrity levels (Low<Medium<High<System) drive UAC. Know the normal process tree."}, {"type": "mc", "q": "You find a service with an unquoted path 'C:\\Program Files\\My App\\svc.exe' and you can write to C:\\. How is this a privilege-escalation path?", "options": ["Only on domain controllers", "Only if you're already SYSTEM", "Windows tries C:\\Program.exe first, so your planted binary runs as the service's account at startup", "It isn't exploitable"], "answer": 2, "exp": "Ch.8: unquoted service paths + weak permissions = escalation/persistence. Services run in the background via the Service Control Manager (sc, net, PsService, PowerShell); defined under HKLM\\SYSTEM\\CurrentControlSet\\Services. Accounts: LocalSystem > NetworkService > LocalService."}]}, {"code": "SX", "name": "Cross-Book - Big-Picture Scenarios", "book": "Cross-Book", "questions": [{"type": "sa", "q": "Put a full attack in Cyber Kill Chain order using the book's tools: msfvenom payload, phishing email, handler/Meterpreter, AV exclusion, recon.", "answer": "Recon -> Weaponize (msfvenom payload) -> Deliver (phishing) -> Exploit/Install (it runs, handler catches the callback) -> C2 (Meterpreter) -> Actions (recon, migrate, add AV exclusion to persist). Kill chain: Real Wizards Don't Exploit In Crowded Alleys.", "exp": "Ties all books together. Misconfigs often beat CVEs as the way in."}, {"type": "sa", "q": "You need password hashes on both a Linux and a Windows box. Where is each, and what's the one-line difference in how users are identified?", "answer": "Linux: /etc/shadow. Windows: SAM (local) + ntds.dit (domain). Linux identifies users by UID numbers (0=root); Windows by SIDs (RID 500=Administrator).", "exp": "Linux Ch.3 + Windows Ch.3/Ch.2."}, {"type": "sa", "q": "Compare the 'extra lockdown' layer and the 'background program' persistence spot on Linux vs Windows.", "answer": "Lockdown: Linux = SELinux or AppArmor; Windows = integrity levels (drive UAC). Background/persistence: Linux = systemd units/timers; Windows = services (Service Control Manager). Both used by admins and attackers.", "exp": "Linux Ch.5/7 + Windows Ch.7/8."}, {"type": "sa", "q": "A defender asks how an attacker hides activity on each OS. Give the history/log trick for Linux vs Windows.", "answer": "Linux: clear bash history (unset HISTFILE) and know logins sit in 3 places (utmp/lastlog/systemd). Windows: cmd history dies with the session, PowerShell PSReadLine file can be deleted, and Base64 hides the command's content; logons show in event 4624 with limits.", "exp": "Linux Ch.1/4 + Windows Ch.1/3."}]}], PLAN=[["Day 1", "Read the cheat sheet out loud, top to bottom. Don't memorize yet - just see the whole map.", "ALL", "20 min"], ["Day 2", "Metasploit scenarios (SA). Quiz mode until 80%.", "SA", "Then re-read the Metasploit half of the cheat sheet."], ["Day 3", "Linux scenarios (SB). Quiz mode until 80%.", "SB", ""], ["Day 4", "Windows scenarios (SC). Quiz mode until 80%.", "SC", ""], ["Day 5", "Cross-book scenarios (SX) + re-quiz SA.", "SX,SA", "Say the 5 mnemonics from memory."], ["Day 6", "Mixed quiz, everything. Write down every miss.", "ALL", "Your miss list is your real study list."], ["Day 7", "Written mode only, everything. Type the answers from memory.", "ALL", "Slowest day, biggest payoff."], ["Day 8", "Re-quiz only what you missed on days 6-7, then a full mixed pass.", "ALL", ""], ["Day 9", "Cheat sheet from memory: cover it and rewrite the mnemonics and the Linux-vs-Windows table.", "ALL", "Then one mixed quiz pass."], ["Day 10", "Full mock: all 33 scenarios, no notes. Review every miss same day.", "ALL", ""]];
const ALL=[];DECKS.forEach(d=>d.questions.forEach((q,i)=>ALL.push(Object.assign({deck:d.code,dname:d.name,book:d.book,id:d.code+'-'+i},q))));
document.getElementById('count').textContent=ALL.length+' questions / '+DECKS.length+' chapters';
const S=JSON.parse(localStorage.getItem('cyberquiz')||'{}');
S.sel=S.sel||DECKS.map(d=>d.code); S.stats=S.stats||{}; S.plan=S.plan||{}; S.mode=S.mode||'quiz';
const save=()=>localStorage.setItem('cyberquiz',JSON.stringify(S));
let view='study',pool=[],idx=0,done=0,right=0,shown=false;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function build(){pool=ALL.filter(q=>S.sel.includes(q.deck)&&(S.mode!=='write'||q.type==='sa'));
 if(S.order!=='seq')pool.sort(()=>Math.random()-.5); idx=0;done=0;right=0;shown=false;}
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function render(){const a=document.getElementById('app');
 if(view==='decks'){a.innerHTML='<div class="card"><div class="row"><b>Chapters in play</b><span class="sp"></span><button id=all>All</button><button id=none>None</button></div>'+
  DECKS.map(d=>{const n=ALL.filter(q=>q.deck===d.code).length;const st=S.stats[d.code]||{s:0,n:0};
  return `<label class="dk"><input type=checkbox data-c="${d.code}" ${S.sel.includes(d.code)?'checked':''}><span><b>${d.code}</b> ${esc(d.name)}<br><span class=small>${d.book} &middot; ${n} questions &middot; lifetime ${st.n?Math.round(100*st.s/st.n)+'% of '+st.n+' answered':'not started'}</span></span></label>`}).join('')+'</div>';
  a.querySelectorAll('input').forEach(i=>i.onchange=()=>{S.sel=[...a.querySelectorAll('input:checked')].map(x=>x.dataset.c);save();build();});
  all.onclick=()=>{S.sel=DECKS.map(d=>d.code);save();build();render();};none.onclick=()=>{S.sel=[];save();build();render();};return;}
 if(view==='plan'){a.innerHTML='<div class="card"><b>10-day plan</b><div class=small>Tick a day to load exactly those chapters into Study. ~30-40 min/day. Review days are quiz-only.</div></div>'+
  PLAN.map((p,i)=>`<div class="card"><div class=row><input type=checkbox data-d="${i}" ${S.plan[i]?'checked':''}><b>${p[0]}</b><span class=sp></span><button data-load="${p[2]}">Load these chapters</button></div>
  <div style="margin-top:6px">${esc(p[1])}</div><div class=small>${esc(p[2])}${p[3]?' &mdash; '+esc(p[3]):''}</div></div>`).join('');
  a.querySelectorAll('input').forEach(i=>i.onchange=()=>{S.plan[i.dataset.d]=i.checked;save();});
  a.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const v=b.dataset.load;S.sel=v==='ALL'?DECKS.map(d=>d.code):v.split(',');save();build();go('study');});return;}
 if(view==='browse'){a.innerHTML='<div class=card><input id=f placeholder="Search questions and answers..." style="width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#10131a;color:var(--fg)"></div><div id=res></div>';
  const draw=t=>{const r=ALL.filter(q=>!t||(q.q+' '+(q.answer||'')+' '+(q.options||[]).join(' ')+q.exp).toLowerCase().includes(t));
   document.getElementById('res').innerHTML=r.map(q=>`<div class=card><span class=pill>${q.deck}</span><div class=q style="margin-top:8px">${esc(q.q)}</div><div class=ans>${esc(q.type==='mc'?q.options[q.answer]:q.answer)}</div><div class=exp>${esc(q.exp)}</div></div>`).join('')||'<div class=card>No match.</div>';};
  draw('');document.getElementById('f').oninput=e=>draw(e.target.value.toLowerCase());return;}
 // study
 if(!pool.length)build();
 const q=pool[idx];
 let h=`<div class=card><div class=row>
  <button data-m="quiz" class="${S.mode==='quiz'?'on':''}">Quiz (multiple choice + written)</button>
  <button data-m="cards" class="${S.mode==='cards'?'on':''}">Flashcards</button>
  <button data-m="write" class="${S.mode==='write'?'on':''}">Written only</button>
  <span class=sp></span><button id=re>Reshuffle</button></div>
  <div class=bar><i style="width:${pool.length?100*idx/pool.length:0}%"></i></div>
  <div class=small>${idx+1} of ${pool.length} &middot; session score ${done?Math.round(100*right/done)+'%':'-'} (${right}/${done})</div></div>`;
 if(!q){a.innerHTML=h+'<div class=card>No questions selected. Go to "Pick chapters".</div>';wire();return;}
 h+=`<div class=card><span class=pill>${q.deck} &middot; ${esc(q.dname)}</span><div class=q style="margin-top:10px">${esc(q.q)}</div>`;
 if(q.type==='mc'&&S.mode==='quiz'){h+=q.options.map((o,i)=>`<button class="opt${shown?(i===q.answer?' correct':(i===shown.pick?' wrong':'')):''}" data-o="${i}">${esc(o)}</button>`).join('');}
 else{h+=`<textarea id=ta placeholder="Say or type your answer from memory, then reveal."></textarea>`;
  if(shown)h+=`<div class=ans><b>Model answer:</b>\n${esc(q.type==='mc'?q.options[q.answer]:q.answer)}</div><div class=row style="margin-top:10px"><button id=gotit>I had it</button><button id=missed>I missed it</button></div>`;
  else h+=`<div class=row style="margin-top:10px"><button id=rev>Reveal answer</button></div>`;}
 if(shown&&q.exp)h+=`<div class=exp>${esc(q.exp)}</div>`;
 if(shown)h+=`<div class=row style="margin-top:12px"><button id=next>Next &rarr;</button></div>`;
 h+='</div>';a.innerHTML=h;wire();}
function score(ok,q){done++;if(ok)right++;const st=S.stats[q.deck]||{s:0,n:0};st.n++;if(ok)st.s++;S.stats[q.deck]=st;save();}
function wire(){const a=document.getElementById('app');
 a.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();build();render();});
 const re=document.getElementById('re');if(re)re.onclick=()=>{build();render();};
 a.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(shown)return;const q=pool[idx];const p=+b.dataset.o;shown={pick:p};score(p===q.answer,q);render();});
 const rev=document.getElementById('rev');if(rev)rev.onclick=()=>{shown={};render();};
 const g=document.getElementById('gotit');if(g)g.onclick=()=>{score(true,pool[idx]);nxt();};
 const m=document.getElementById('missed');if(m)m.onclick=()=>{score(false,pool[idx]);pool.push(pool[idx]);nxt();};
 const n=document.getElementById('next');if(n)n.onclick=nxt;}
function nxt(){idx=(idx+1)%pool.length;shown=false;render();}
build();render();
</script></body></html>

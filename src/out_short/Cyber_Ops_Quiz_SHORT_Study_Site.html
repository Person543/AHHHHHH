<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyber Ops Quiz Trainer</title><style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e8eaf0;--mut:#9aa3b2;--acc:#4f9cff;--ok:#2fbf71;--bad:#ff5c6c}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;background:#12141a;border-bottom:1px solid var(--line);padding:10px 16px;z-index:5}
h1{font-size:17px;margin:0 0 8px}nav{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on{background:var(--acc);border-color:var(--acc);color:#07101f;font-weight:600}
main{max-width:860px;margin:0 auto;padding:18px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.q{font-size:19px;font-weight:600;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px}
.opt.correct{background:rgba(47,191,113,.18);border-color:var(--ok)}.opt.wrong{background:rgba(255,92,108,.16);border-color:var(--bad)}
.exp{color:var(--mut);font-size:14px;border-left:3px solid var(--acc);padding-left:10px;margin-top:12px;white-space:pre-wrap}
.ans{background:#10131a;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.pill{font-size:12px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.bar{height:7px;background:#20242e;border-radius:99px;overflow:hidden;margin:10px 0}.bar>i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;font-size:14px}
label.dk{display:flex;gap:8px;align-items:flex-start;padding:7px;border-bottom:1px solid var(--line);font-size:14px}
textarea{width:100%;min-height:90px;background:#10131a;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.small{font-size:13px;color:var(--mut)}.big{font-size:28px;font-weight:700}
</style></head><body>

<script>
const DECKS=[{"code": "A1", "name": "Metasploit Ch.1 - Foundations", "book": "Initial Access with Metasploit and Meterpreter", "questions": [{"type": "mc", "q": "Which one is FALSE?", "options": ["Attackers skip misconfigurations and only chase CVEs", "Kill Chain and MITRE ATT&CK give attacks a structure", "Labs are built with virtualization so you get hands-on time", "CVE names the bug, CVSS scores how bad it is"], "answer": 0, "exp": "Misconfigs are at least as important as CVEs, and attackers often PREFER them (no exploit needed, no alert)."}, {"type": "sa", "q": "CVE vs CVSS?", "answer": "CVE = the bug's name. CVSS = the bug's score (0-10).", "exp": "Hook: NamE vs ScorE."}, {"type": "sa", "q": "Cyber Kill Chain, 7 steps?", "answer": "Recon, Weaponize, Deliver, Exploit, Install, C2, Actions.", "exp": "Hook: Real Wizards Don't Exploit In Crowded Alleys."}, {"type": "sa", "q": "ATT&CK: tactic vs technique?", "answer": "Tactic = the goal. Technique = the trick used to get it.", "exp": "Goal vs how."}, {"type": "sa", "q": "Two more Ch.1 takeaways?", "answer": "Metasploit = a professional framework for offense. Pros keep the highest ethical standards.", "exp": "Plus: admin creds on Windows = a Meterpreter shell."}]}, {"code": "A2", "name": "Metasploit Ch.2 - Meterpreter", "book": "Initial Access with Metasploit and Meterpreter", "questions": [{"type": "mc", "q": "Meterpreter migration goes which way?", "options": ["From low up to SYSTEM", "Only sideways, same user", "It cannot migrate", "From a higher privileged process down to lower privileged ones"], "answer": 3, "exp": "2.4: high -> low. What it can see depends on the privileges of the process it sits in."}, {"type": "sa", "q": "4 things Meterpreter lets you do?", "answer": "Recon the system, recon the network, mess with files, run code, change the registry.", "exp": "Hook: Look, Look, Take, Run, Edit."}, {"type": "sa", "q": "Where does Meterpreter live?", "answer": "Inside a running process, in memory - not a file on disk. That's why file scanning misses it.", "exp": "migrate <PID> moves it."}, {"type": "sa", "q": "3 ways Meterpreter gets extended?", "answer": "Run PowerShell or Python on the target, read the clipboard, use ADSI to scope out the domain.", "exp": "Hook: Script, Steal, Snoop."}]}, {"code": "A3", "name": "Metasploit Ch.3 - The Framework", "book": "Initial Access with Metasploit and Meterpreter", "questions": [{"type": "mc", "q": "The 7 module types?", "options": ["exploit, scanner, trojan, rootkit, nop", "exploit, payload, auxiliary, post, encoders, evasion, nop", "recon, exploit, post, report", "payload, listener, dropper, loader, shell"], "answer": 1, "exp": "Hook: Every Pirate Always Plunders Every Empty Navy."}, {"type": "sa", "q": "EXAM: Staged vs stageless payload - what's the difference?", "answer": "Staged = tiny stub lands first, then downloads the rest. Stageless = the whole thing ships at once.", "exp": "Hook: slash = staged (meterpreter/reverse_tcp), underscore = stageless (meterpreter_reverse_tcp)."}, {"type": "sa", "q": "EXAM: When do you pick each one?", "answer": "Staged when space is tiny (small buffer) - it's small. Stageless when the network is shaky or you only get one connection - it needs nothing else.", "exp": "Small hole = staged. Bad network = stageless."}, {"type": "sa", "q": "Bind vs reverse payload - which beats a firewall?", "answer": "Reverse: the target calls out to you (LHOST/LPORT). Bind: the target listens and you call in. Reverse wins, since outbound is usually allowed.", "exp": "Not all payloads call back - some just run commands, like creating a user."}, {"type": "sa", "q": "What are handlers and jobs?", "answer": "A handler catches the callback. Run it as a job (exploit -j) so it sits in the background. Keylogging can run as a job too.", "exp": "sessions -l to list, sessions -i to use."}, {"type": "sa", "q": "3 ways Metasploit is customized?", "answer": "It logs your commands, saves results in its database, and can be scripted.", "exp": "spool, msfdb, resource scripts."}]}, {"code": "A4", "name": "Metasploit Ch.4 - Brute Force Attacks", "book": "Initial Access with Metasploit and Meterpreter", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["Linux is faster to brute force than Windows, and SSH beats SMB", "Metasploit brute forces SMB and SSH", "The 4 features are userlist, wordlist, time, defenses", "Kali ships password lists and you can build your own"], "answer": 0, "exp": "It's the reverse: Windows is faster than Linux, SMB is faster than SSH. Hook: Windows Wins, SMB is Speedy."}, {"type": "sa", "q": "4 features of a brute force attack?", "answer": "Userlist, wordlist, time it takes, defenses in the way.", "exp": "Hook: Users Want Time Delays."}, {"type": "sa", "q": "Shells on a Linux target?", "answer": "You can get a plain Linux shell or Meterpreter. Upgrade the plain one with sessions -u.", "exp": ""}, {"type": "sa", "q": "2 non-Metasploit brute force tools?", "answer": "NetExec and CrackMapExec. You can also write your own.", "exp": ""}, {"type": "sa", "q": "Where do wordlists come from?", "answer": "Kali's built-in lists (rockyou.txt) or ones you generate yourself (crunch, cewl).", "exp": ""}, {"type": "sa", "q": "What stops a brute force attack?", "answer": "Lockout, rate limiting, strong passwords, MFA, SSH keys only, alerts on failed logins.", "exp": "These are the 'defenses' feature."}]}, {"code": "A5", "name": "Metasploit Ch.5 - Phishing Attacks", "book": "Initial Access with Metasploit and Meterpreter", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["Web delivery scripts let you build custom phishing", "Phishing is a common first way in", "Modules build phishing docs for Microsoft Office, LibreOffice and OpenOffice", "Microsoft's mitigations can't be beaten, so Office phishing is dead"], "answer": 3, "exp": "Office suites have had bugs that evade the mitigations, and Metasploit has modules for them."}, {"type": "sa", "q": "What's special about a malicious .hta file?", "answer": "On older systems, just visiting the site is enough - no opening a file.", "exp": ""}, {"type": "sa", "q": "Unprivileged session on a Windows desktop - what can you still get?", "answer": "Phish the logged-on user for their domain or local password.", "exp": "phish_windows_credentials - it keeps re-asking until the password is real."}, {"type": "sa", "q": "What is web delivery?", "answer": "A one-line command you host; when it runs on the target it pulls your payload into memory.", "exp": ""}, {"type": "sa", "q": "How does Microsoft fight phishing docs?", "answer": "Protected View and blocking macros in files from the internet, so the user has to click Enable Content.", "exp": ""}]}, {"code": "A6", "name": "Metasploit Ch.6 - Malware", "book": "Initial Access with Metasploit and Meterpreter", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["It can spit out source code you compile yourself", "Encoding the payload reliably beats modern antivirus", "msfvenom makes stand-alone malware in many formats", "It can hide malware in a real Windows program and keep that program working"], "answer": 1, "exp": "Encoders dodge bad characters, not AV. Modern AV watches behavior, memory and the cloud."}, {"type": "sa", "q": "msfvenom flags: -p, -f, -o, -x, -k?", "answer": "-p payload, -f format, -o output file, -x real program to hide in, -k keep that program working.", "exp": "-x -k = the lure still does what the victim expects."}, {"type": "sa", "q": "Static vs dynamic analysis?", "answer": "Static = look at the file without running it. Dynamic = run it and watch.", "exp": "Static: strings, hashes, Ghidra. Dynamic on Linux: strace, gdb."}, {"type": "sa", "q": "What decides if your malware runs on the target?", "answer": "The target's antivirus. Windows ships with Microsoft Defender.", "exp": ""}]}, {"code": "A7", "name": "Metasploit Ch.7 - Antivirus / Defender", "book": "Initial Access with Metasploit and Meterpreter", "questions": [{"type": "mc", "q": "Tamper protection is ON. What can an admin still do?", "options": ["Nothing, every setting is locked", "Only empty quarantine", "Disable Defender in the registry, still supported", "Add exclusions - and excluded stuff is never scanned"], "answer": 3, "exp": "7.9: this is the big one. Tamper protection locks settings, but exclusions still go in - a blind spot without turning Defender off."}, {"type": "sa", "q": "Where do Defender's removed threats go?", "answer": "Quarantine on the system - and they can be restored.", "exp": ""}, {"type": "sa", "q": "Can you disable Defender in the registry?", "answer": "Old Windows, yes. Current Windows, no - not supported anymore.", "exp": ""}, {"type": "sa", "q": "What does this chapter NOT teach?", "answer": "How to change malware to get past Defender.", "exp": ""}, {"type": "sa", "q": "How do you manage Defender from a prompt?", "answer": "MpCmdRun.exe, or PowerShell: Get-MpComputerStatus, Get/Set-MpPreference, Add-MpPreference -ExclusionPath, Start-MpScan.", "exp": "Quick scan = usual hiding spots. Full scan = every file."}]}, {"code": "B1", "name": "Linux Ch.1 - Bash and Shells", "book": "Linux for Cyber Operations", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["Bash can't use the network, so attackers ignore it", "You reach Linux through terminals and pseudoterminals running shells", "Bash keeps state in options, variables and environment variables", "A shell acts differently based on how it's configured and started"], "answer": 0, "exp": "Bash CAN talk over the network - reverse shells and exfil. That's why it matters to both sides."}, {"type": "sa", "q": "Which env variable is the security one, and why?", "answer": "PATH. A writable folder early in PATH lets someone swap in a fake command.", "exp": "Fix: trusted dirs only, never '.', use full paths."}, {"type": "sa", "q": "Who wants Bash history, who doesn't?", "answer": "Admins want it recorded. Attackers make sure it isn't.", "exp": "unset HISTFILE, HISTSIZE=0, set +o history, delete ~/.bash_history."}, {"type": "sa", "q": "Login vs non-login shell - why care?", "answer": "They read different files, so the shell behaves differently. Login: /etc/profile + ~/.bash_profile. Non-login: ~/.bashrc.", "exp": ""}, {"type": "sa", "q": "Two Bash conveniences from 1.7?", "answer": "Aliases (shortcuts for commands) and jobs (several tasks in one session).", "exp": "& , Ctrl+Z, jobs, fg, bg."}]}, {"code": "B2", "name": "Linux Ch.2 - Users and Groups", "book": "Linux for Cyber Operations", "questions": [{"type": "mc", "q": "Which tool pairing is right?", "options": ["adduser is low level, useradd is a Perl script", "usermod creates users", "useradd/userdel = low level; adduser/deluser = Perl scripts on Mint & Ubuntu; usermod = change a user", "They're all the same command"], "answer": 2, "exp": "2.4 exactly."}, {"type": "sa", "q": "The 4 account files?", "answer": "/etc/passwd, /etc/shadow, /etc/group, /etc/gshadow.", "exp": "Hook: passwd + shadow for users, group + gshadow for groups. Hashes live in shadow."}, {"type": "sa", "q": "3 states an account can be in?", "answer": "Locked, unlocked, expired.", "exp": "Lock = '!' in front of the hash (passwd -l)."}, {"type": "sa", "q": "Expired password vs expired account?", "answer": "Expired password = change it at login. Expired account = you can't log in at all.", "exp": ""}, {"type": "sa", "q": "What is /etc/nologin?", "answer": "If that file exists, nobody but root can log in - and they see its message.", "exp": "Used during maintenance."}, {"type": "sa", "q": "What does chfn change?", "answer": "The user's name/office/phone info (the GECOS field in /etc/passwd).", "exp": ""}]}, {"code": "B3", "name": "Linux Ch.3 - Passwords and PAM", "book": "Linux for Cyber Operations", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["You can hash a password you already know and compare", "John reverses the hash to get the password back", "John the Ripper guesses over and over", "Hashes for local users sit in /etc/shadow"], "answer": 1, "exp": "Hashes are one way. Cracking = guess, hash, compare."}, {"type": "sa", "q": "What is PAM, and who can change it?", "answer": "Pluggable Authentication Modules - how Linux authenticates you. Admins configure it, and attackers with enough privilege can too.", "exp": "Config lives in /etc/pam.d."}, {"type": "sa", "q": "How does pam_exec.so get abused?", "answer": "It runs any program during login, so an attacker gets a shell on every SSH attempt - even failed ones.", "exp": ""}, {"type": "sa", "q": "What does pam_pwhistory.so do?", "answer": "Stops people reusing old passwords.", "exp": ""}, {"type": "sa", "q": "Read a shadow hash: $6$ vs $1$ vs $y$?", "answer": "$1$ = MD5, $5$ = SHA-256, $6$ = SHA-512, $y$ = yescrypt. A '!' or '*' means no password login.", "exp": ""}, {"type": "sa", "q": "Why does a salt matter?", "answer": "Same password, different hash on every account - so precomputed tables are useless.", "exp": ""}]}, {"code": "B4", "name": "Linux Ch.4 - Privileges and Login Logs", "book": "Linux for Cyber Operations", "questions": [{"type": "mc", "q": "Which definition is wrong?", "options": ["Polkit = command-line only, no GUI role", "sudo = run a command as someone else, set up by admins", "su = become another user", "runuser = admin runs a command as another user"], "answer": 0, "exp": "Polkit is the one used in GRAPHICAL environments."}, {"type": "sa", "q": "The 3 login record systems?", "answer": "utmp (login & ssh), lastlog (PAM), systemd.", "exp": "Hook: U-L-S."}, {"type": "sa", "q": "Which tool reads which?", "answer": "utmp: who, w, last. lastlog file: lastlog. systemd: loginctl.", "exp": "last reads wtmp history, lastb reads btmp failed logins."}, {"type": "sa", "q": "Why does having 3 records help defenders?", "answer": "Different programs write them, so wiping one still leaves the login in the others.", "exp": ""}, {"type": "sa", "q": "Where is sudo configured, and what edits it?", "answer": "/etc/sudoers, edited with visudo (it checks your syntax first).", "exp": "sudo -l shows what you can run."}]}, {"code": "B5", "name": "Linux Ch.5 - Processes and systemd", "book": "Linux for Cyber Operations", "questions": [{"type": "mc", "q": "Why do attackers rename their process?", "options": ["To use less memory", "Renaming raises privileges", "systemd requires it", "Because defenders hunt by name - but /proc/<pid>/exe still shows the real file"], "answer": 3, "exp": "5.6 plus the fix."}, {"type": "sa", "q": "5 process tools?", "answer": "ps, pidof, pgrep, pstree, top.", "exp": "Hook: Please Pick Pretty Process Trees."}, {"type": "sa", "q": "How do you talk to a running process?", "answer": "Send it a signal.", "exp": "SIGTERM 15 = polite, can be caught. SIGKILL 9 = instant, can't be caught."}, {"type": "sa", "q": "What's in /proc?", "answer": "A folder per running process with its details - cmdline, exe, environ, fd.", "exp": ""}, {"type": "sa", "q": "Who manages Linux startup, and who else uses it?", "answer": "systemd (PID 1). Admins run services with it; attackers plant their own unit or timer for persistence.", "exp": "systemctl enable/start/status, journalctl -u."}]}, {"code": "B6", "name": "Linux Ch.6 - Files and File Systems", "book": "Linux for Cyber Operations", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["Deleting the original always breaks a hard link", "A symlink just stores a path, so it breaks if the target goes away", "Files map to inodes on devices", "A hard link is a second name for the same inode"], "answer": 0, "exp": "Hard links keep the data alive - only the link count drops. Symlinks are the fragile ones."}, {"type": "sa", "q": "Hard link vs symlink?", "answer": "Hard = same inode, same file system, files only. Soft = a path, can cross file systems and point at folders.", "exp": ""}, {"type": "sa", "q": "SUID, SGID, sticky bit?", "answer": "SUID = runs as the file's owner. SGID = runs as the group. Sticky = in a shared folder, only the owner can delete their file (/tmp).", "exp": "find / -perm -4000 hunts SUID."}, {"type": "sa", "q": "Basic permissions and the extras?", "answer": "rwx for user, group, world. Extras: immutable (chattr +i) and ACLs (getfacl/setfacl).", "exp": ""}, {"type": "sa", "q": "What does lsof show?", "answer": "Open files and network sockets.", "exp": ""}, {"type": "sa", "q": "Lost the root password - how does mounting save you?", "answer": "Boot rescue media, mount the disk, chroot in, reset the password. Same trick reads a Windows disk.", "exp": ""}, {"type": "sa", "q": "Why does the standard directory layout matter?", "answer": "Every distro puts things in the same place: /etc config, /var logs, /home users, /usr software, /proc processes.", "exp": ""}]}, {"code": "B7", "name": "Linux Ch.7 - SELinux and AppArmor", "book": "Linux for Cyber Operations", "questions": [{"type": "mc", "q": "Which comparison is right?", "options": ["Both always run together", "SELinux only logs, never blocks", "SELinux = labels on everything, deny by default, tuned with Booleans. AppArmor = one profile per important program. Usually only one is on", "AppArmor uses the 4-part context"], "answer": 2, "exp": "7.13 + chapter bullets."}, {"type": "sa", "q": "The 4 parts of an SELinux context?", "answer": "User, role, type, level.", "exp": "Hook: U aRe Totally Locked. Applied to users, files, processes and ports."}, {"type": "sa", "q": "SELinux's default behavior, and what simplifies it?", "answer": "Blocks anything no rule allows. Booleans are the easy on/off switches for policies.", "exp": ""}, {"type": "sa", "q": "SELinux modes and commands?", "answer": "Enforcing, permissive (log only), disabled. getenforce to check, setenforce 0/1 to switch.", "exp": "ls -Z shows contexts, restorecon fixes them."}, {"type": "sa", "q": "AppArmor: what does it protect, and what are the 2 modes?", "answer": "Critical programs, each with a profile. Modes: enforce (block) and complain (log only).", "exp": "aa-status shows them."}, {"type": "sa", "q": "What does aa-logprof do?", "answer": "Reads the denials in the log and walks you through fixing the profile.", "exp": "That's how passwd got its audit_write capability back."}]}, {"code": "B8", "name": "Linux Ch.8 - Software Management", "book": "Linux for Cyber Operations", "questions": [{"type": "mc", "q": "Which mapping is right?", "options": ["apt = SUSE, zypper = Ubuntu", "Everything uses apt", "yum = Ubuntu, apt = Rocky", "apt = Debian/Ubuntu/Mint, dnf & yum = Red Hat/Rocky/CentOS, zypper = SUSE"], "answer": 3, "exp": "8.7's four package managers."}, {"type": "sa", "q": "Where does software come from, and what must admins check?", "answer": "Repositories - and that they're valid (signed with trusted GPG keys).", "exp": "A fake repo = a supply-chain hack."}, {"type": "sa", "q": "What are Snap and Flatpak?", "answer": "Ways to ship a program with its dependencies bundled in.", "exp": "Downside: the bundle's libraries get patched by its publisher, not your distro."}, {"type": "sa", "q": "What can admins verify about installed software?", "answer": "Its hashes - rpm -V, debsums, sha256sum.", "exp": ""}]}, {"code": "C1", "name": "Windows Ch.1 - cmd, PowerShell, Env Variables", "book": "Windows for Cyber Operations", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["cmd runs commands stored in the registry when it starts", "cmd records its history", "PowerShell is the modern, extendable shell and now runs on Linux too", "Batch and VBScript are gone from Windows"], "answer": 3, "exp": "1.8/Ch1: the old batch scripts and VBScript still work."}, {"type": "sa", "q": "What does cmd run at startup, and why do attackers like it?", "answer": "The AutoRun value in the registry - so their command runs every time cmd opens.", "exp": "Quiet persistence inside a trusted program."}, {"type": "sa", "q": "What can PowerShell be extended with?", "answer": ".NET, and the older COM, DCOM and COM+ objects. Modules can be downloaded and added.", "exp": ""}, {"type": "sa", "q": "PowerShell history: how many ways, plus what?", "answer": "Two history methods, plus a full transcript if you turn it on.", "exp": "Session history (Get-History, gone at close) + PSReadLine file (survives reboot) + Start-Transcript."}, {"type": "sa", "q": "Two ways to obfuscate PowerShell?", "answer": "Base64-encoded commands (-EncodedCommand) and downloaded modules.", "exp": ""}, {"type": "sa", "q": "Env variable scopes, and how you set them?", "answer": "Process, User, Machine. Set with set / $env: (temporary) or setx and the GUI (permanent).", "exp": ""}]}, {"code": "C2", "name": "Windows Ch.2 - Users and Groups", "book": "Windows for Cyber Operations", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["Every user and group has a SID; some well-known SIDs are the same everywhere", "A domain group and a local group with the same name are the same group", "Local account data lives in the SAM; domain account data lives in Active Directory", "Users and groups control access, rights and privileges"], "answer": 1, "exp": "2.10: they're different, and being in the domain group does NOT put you in the local group."}, {"type": "sa", "q": "Local user vs domain user?", "answer": "Local = one system, stored in that system's SAM. Domain = the whole domain plus trusting domains and forests, stored in Active Directory.", "exp": ""}, {"type": "sa", "q": "4 special Windows accounts?", "answer": "Administrator, NT AUTHORITY\\SYSTEM, Guest, machine accounts.", "exp": "SYSTEM = the most local power; on the network it shows up as the computer account."}, {"type": "sa", "q": "Local group vs domain group?", "answer": "Local group gives rights on one system. Domain group gives rights across the domain.", "exp": ""}, {"type": "sa", "q": "What is a well-known SID? One example.", "answer": "A SID that's identical on every Windows system. S-1-5-18 = SYSTEM; RID 500 = Administrator.", "exp": ""}]}, {"code": "C3", "name": "Windows Ch.3 - Logons, Tokens, UAC, Hashes", "book": "Windows for Cyber Operations", "questions": [{"type": "mc", "q": "Where are Windows password hashes, and in what format?", "options": ["Plaintext in the registry", "NTLM hashes in the local SAM and in ntds.dit on domain controllers", "SHA-512 in /etc/shadow", "bcrypt in HKCU"], "answer": 1, "exp": "3.6. They're protected - even SYSTEM can't read them directly."}, {"type": "sa", "q": "You log on to Windows - what do you get?", "answer": "A login ID and one or more access tokens.", "exp": "Logon types: 2 interactive, 3 network, 10 RDP."}, {"type": "sa", "q": "What does UAC do, and what controls it?", "answer": "Lets you use a privileged token when you need it. Controlled by registry policies, set by group policy or local security policy.", "exp": ""}, {"type": "sa", "q": "Hashes are protected from SYSTEM - so how do attackers get them?", "answer": "Windows tools run from an Administrator or Backup Operator account.", "exp": "Backup Operators can read protected files, which is why it's basically an admin group."}, {"type": "sa", "q": "Two things to do with a stolen hash?", "answer": "Crack it (John the Ripper) or pass-the-hash - use the hash itself instead of the password.", "exp": ""}, {"type": "sa", "q": "Privileges and rights - what are they for?", "answer": "Fine-grained control over what a user can do.", "exp": "whoami /priv lists yours."}, {"type": "sa", "q": "Finding who's logged on - what's the catch?", "answer": "There are several ways (query user, psloggedon, WMI, event 4624) but every one of them has limitations.", "exp": ""}]}, {"code": "C4", "name": "Windows Ch.4 - Files", "book": "Windows for Cyber Operations", "questions": [{"type": "mc", "q": "Why do attackers ship payloads inside .iso or .vhd files?", "options": ["Windows auto-trusts them", "Those containers avoid the Mark of the Web, and marked files get extra scrutiny", "They can't be scanned", "They download faster"], "answer": 1, "exp": "Ch4. MOTW is how Windows tracks internet downloads."}, {"type": "sa", "q": "What is the Mark of the Web stored in?", "answer": "An NTFS alternate data stream - one file holding more than one stream.", "exp": "Copy to FAT32 and the mark is gone."}, {"type": "sa", "q": "Two ways to name a Windows file?", "answer": "The full case-insensitive name, or the old 8.3 short name (PROGRA~1).", "exp": "Files also carry attributes (hidden, read only) and several timestamps."}, {"type": "sa", "q": "Hard link vs junction vs symlink in Windows?", "answer": "Hard link = between files. Junction = between directories. Symlink = admin-made, can point at relative or network paths.", "exp": "Shortcuts (.lnk) are just files that point somewhere."}, {"type": "sa", "q": "Two special Windows file locations?", "answer": "The hidden desktop.ini in each folder, and C:\\Users\\Public.", "exp": ""}, {"type": "sa", "q": "What manages Windows files?", "answer": "File Explorer, command-line tools and PowerShell.", "exp": ""}]}, {"code": "C5", "name": "Windows Ch.5 - Access Control", "book": "Windows for Cyber Operations", "questions": [{"type": "mc", "q": "What are the 4 parts of a security descriptor?", "options": ["Owner, group, world, other", "User, role, type, level", "Read, write, execute, deny", "Owner SID + primary group, DACL, SACL, flags"], "answer": 3, "exp": "5.10. Hook: Only Good Dogs Sit First - Owner, Group, DACL, SACL, Flags."}, {"type": "sa", "q": "DACL vs SACL?", "answer": "DACL = who gets in (access). SACL = what gets logged (auditing).", "exp": "Hook: Door vs Security camera."}, {"type": "sa", "q": "Which objects have a security descriptor?", "answer": "Securable objects: files, directories, registry items, processes.", "exp": ""}, {"type": "sa", "q": "Tools for viewing and setting permissions?", "answer": "PowerShell (Get-Acl/Set-Acl) and icacls. Sysinternals AccessChk and AccessEnum to look around. File Explorer works but its interface has subtle issues.", "exp": "SDDL = permissions written as a string."}, {"type": "sa", "q": "Windows protects some files even from SYSTEM. Who can still change them, and what attack uses that?", "answer": "Admins, or anyone with SeTakeOwnershipPrivilege or SeRestorePrivilege - they take ownership first. That's the Sticky Keys attack.", "exp": "Replace sethc.exe with cmd.exe, hit Shift 5 times at the lock screen = SYSTEM shell."}, {"type": "sa", "q": "What defends against that?", "answer": "Windows Resource Protection.", "exp": ""}]}, {"code": "C6", "name": "Windows Ch.6 - The Registry", "book": "Windows for Cyber Operations", "questions": [{"type": "mc", "q": "Which is FALSE?", "options": ["The registry is keys, subkeys and values holding data", "Some keys are volatile and built while the system runs", "Most keys live in hive files on disk", "Registry keys have no permissions"], "answer": 3, "exp": "6.5: keys and values are securable objects with a DACL, plus extra registry-specific permissions."}, {"type": "sa", "q": "3 ways to work with the registry?", "answer": "Registry Editor (GUI), the reg command, and PowerShell (with .NET).", "exp": ""}, {"type": "sa", "q": "The 5 root keys?", "answer": "HKLM (system), HKCU (you), HKU (all users), HKCR (file types/COM), HKCC (hardware profile).", "exp": ""}, {"type": "sa", "q": "Where do hive files live?", "answer": "System hives in C:\\Windows\\System32\\config; your own hive is NTUSER.DAT in your profile.", "exp": ""}, {"type": "sa", "q": "Two registry spots attackers use for persistence?", "answer": "The Run / RunOnce keys and the Services key. (Plus cmd's AutoRun from Ch.1.)", "exp": ""}]}, {"code": "C7", "name": "Windows Ch.7 - Processes", "book": "Windows for Cyber Operations", "questions": [{"type": "mc", "q": "Defenders check the parent process. What do attackers do?", "options": ["Rename the kernel", "Obfuscate (spoof) their parent so they look like a child of something normal", "Nothing - parents can't be faked", "Delete the process list"], "answer": 1, "exp": "Ch7. Red flag: Word spawning PowerShell."}, {"type": "sa", "q": "Application vs process vs thread?", "answer": "An application is a program running one or more processes, and each process runs one or more threads.", "exp": ""}, {"type": "sa", "q": "Tools for viewing and managing processes?", "answer": "Command-line tools (tasklist/taskkill), Task Manager, Process Explorer, PowerShell (Get-Process).", "exp": ""}, {"type": "sa", "q": "What are integrity levels used for?", "answer": "They rank processes and objects, and they're what makes UAC work.", "exp": "Low < Medium (normal user) < High (elevated admin) < System."}, {"type": "sa", "q": "Why learn the normal Windows processes?", "answer": "So an odd one stands out - like svchost.exe whose parent isn't services.exe, or lsass.exe running from the wrong folder.", "exp": "Normal chain: System > smss > wininit > services/lsass; winlogon > userinit > explorer."}]}, {"code": "C8", "name": "Windows Ch.8 - Services", "book": "Windows for Cyber Operations", "questions": [{"type": "mc", "q": "What is a Windows service?", "options": ["A driver only", "A program you double-click", "A scheduled task", "A program built to run in the background without a user launching it"], "answer": 3, "exp": "8.3."}, {"type": "sa", "q": "How does a service get controlled?", "answer": "The service talks to a service control program, and you send your commands to that control program.", "exp": ""}, {"type": "sa", "q": "Tools that manage services?", "answer": "GUI tools (services.msc), sc, net, PsService (Sysinternals), and PowerShell.", "exp": "Hook: GUI, sc, net, PsService, PowerShell."}, {"type": "sa", "q": "Service start types and accounts?", "answer": "Automatic, Manual, Disabled. Accounts: LocalSystem (most power), NetworkService, LocalService.", "exp": ""}, {"type": "sa", "q": "Two service misconfigs attackers abuse?", "answer": "Unquoted paths with spaces, and weak permissions letting you swap the binary or repoint it.", "exp": "Services are defined under HKLM\\SYSTEM\\CurrentControlSet\\Services."}]}, {"code": "X", "name": "Cross-Book - Linux vs Windows (Quick Compare)", "book": "Cross-Book Synthesis", "questions": [{"type": "sa", "q": "Password hashes: Linux vs Windows?", "answer": "Linux: /etc/shadow. Windows: NTLM in the SAM, and ntds.dit for the domain.", "exp": ""}, {"type": "sa", "q": "Identifying users: Linux vs Windows?", "answer": "Linux: UID numbers (0 = root). Windows: SIDs (RID 500 = Administrator).", "exp": ""}, {"type": "sa", "q": "Permissions: Linux vs Windows?", "answer": "Linux: rwx for user/group/world, plus SUID/SGID/sticky and ACLs. Windows: a security descriptor - owner, group, DACL, SACL, flags.", "exp": ""}, {"type": "sa", "q": "Getting elevated: Linux vs Windows?", "answer": "Linux: sudo, su, runuser, Polkit for the GUI. Windows: UAC elevating your token, or runas.", "exp": ""}, {"type": "sa", "q": "Extra lockdown layer: Linux vs Windows?", "answer": "Linux: SELinux or AppArmor. Windows: integrity levels, which drive UAC.", "exp": ""}, {"type": "sa", "q": "Background programs: Linux vs Windows?", "answer": "Linux: systemd units. Windows: services under the Service Control Manager. Both are used for persistence.", "exp": ""}, {"type": "sa", "q": "Login records: Linux vs Windows?", "answer": "Linux: utmp, lastlog, systemd. Windows: Security event log (4624), query user, psloggedon - all with limits.", "exp": ""}, {"type": "sa", "q": "Hiding history: Linux vs Windows?", "answer": "Linux: unset HISTFILE, delete ~/.bash_history. Windows: cmd history dies with the session; PowerShell's PSReadLine file can be deleted, and Base64 hides the command's content.", "exp": ""}, {"type": "sa", "q": "Links: Linux vs Windows?", "answer": "Linux: hard links and symlinks. Windows: shortcuts, hard links (files), junctions (folders), symlinks (admin only).", "exp": ""}, {"type": "sa", "q": "Put the whole attack in Kill Chain order.", "answer": "Build the payload (msfvenom) > deliver it (phishing, or brute force your way in) > it runs and your handler catches it > Meterpreter session > migrate, recon, keylog, add an AV exclusion to stay.", "exp": ""}]}], PLAN=[["Day 1", "Metasploit Ch.1 Foundations + Ch.2 Meterpreter", "A1,A2", "Learn mode then Quiz each deck once. Aim 80%."], ["Day 2", "Metasploit Ch.3 The Framework", "A3", "Memorize the 7 module types and staged vs stageless. Write the staged/stageless answer out by hand."], ["Day 3", "Metasploit Ch.4 Brute Force + Ch.5 Phishing", "A4,A5", ""], ["Day 4", "Metasploit Ch.6 Malware + Ch.7 Defender", "A6,A7", "Then re-quiz A1-A3."], ["Day 5", "REVIEW: all Metasploit", "A1,A2,A3,A4,A5,A6,A7", "Mixed quiz. Anything under 80% goes on your weak list."], ["Day 6", "Linux Ch.1 Bash + Ch.2 Users/Groups", "B1,B2", ""], ["Day 7", "Linux Ch.3 Passwords/PAM + Ch.4 sudo & Logs", "B3,B4", "Re-quiz A4-A7 (review 2)."], ["Day 8", "Linux Ch.5 Processes/systemd + Ch.6 Files", "B5,B6", ""], ["Day 9", "Linux Ch.7 SELinux/AppArmor + Ch.8 Software", "B7,B8", "SELinux vs AppArmor one-liners out loud."], ["Day 10", "REVIEW: all Linux", "B1,B2,B3,B4,B5,B6,B7,B8", "Mixed quiz + re-quiz your weak list."], ["Day 11", "Windows Ch.1 cmd/PowerShell + Ch.2 Users/Groups", "C1,C2", ""], ["Day 12", "Windows Ch.3 Logons, Tokens, UAC, Hashes", "C3", "Densest chapter - do it alone. Write out pass-the-hash."], ["Day 13", "Windows Ch.4 Files + Ch.5 Access Control", "C4,C5", "Write out the Sticky Keys attack and the 4 security descriptor parts."], ["Day 14", "HALFWAY REVIEW: Metasploit + Linux mixed", "A1,A3,A5,A7,B2,B4,B6,B8", "Quiz only, no flashcards. Track score."], ["Day 15", "Windows Ch.6 Registry + Ch.7 Processes", "C6,C7", "5 root keys, hive locations, integrity levels, core process tree."], ["Day 16", "Windows Ch.8 Services + start Cross-Book", "C8,X", ""], ["Day 17", "REVIEW: all Windows", "C1,C2,C3,C4,C5,C6,C7,C8", "Mixed quiz + weak list."], ["Day 18", "Cross-book compare & contrast", "X", "Say each Linux-vs-Windows pair out loud from memory, then check."], ["Day 19", "SHORT-ANSWER DRILL", "ALL", "Write mode only, every chapter. These are the exam-style questions."], ["Day 20", "FULL MOCK EXAM", "ALL", "Quiz mode, all decks, shuffled, no notes. Review every miss the same day."]];
const ALL=[];DECKS.forEach(d=>d.questions.forEach((q,i)=>ALL.push(Object.assign({deck:d.code,dname:d.name,book:d.book,id:d.code+'-'+i},q))));
document.getElementById('count').textContent=ALL.length+' questions / '+DECKS.length+' chapters';
const S=JSON.parse(localStorage.getItem('cyberquiz')||'{}');
S.sel=S.sel||DECKS.map(d=>d.code); S.stats=S.stats||{}; S.plan=S.plan||{}; S.mode=S.mode||'quiz';
const save=()=>localStorage.setItem('cyberquiz',JSON.stringify(S));
let view='study',pool=[],idx=0,done=0,right=0,shown=false;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function build(){pool=ALL.filter(q=>S.sel.includes(q.deck)&&(S.mode!=='write'||q.type==='sa'));
 if(S.order!=='seq')pool.sort(()=>Math.random()-.5); idx=0;done=0;right=0;shown=false;}
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render();}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
function render(){const a=document.getElementById('app');
 if(view==='decks'){a.innerHTML='<div class="card"><div class="row"><b>Chapters in play</b><span class="sp"></span><button id=all>All</button><button id=none>None</button></div>'+
  DECKS.map(d=>{const n=ALL.filter(q=>q.deck===d.code).length;const st=S.stats[d.code]||{s:0,n:0};
  return `<label class="dk"><input type=checkbox data-c="${d.code}" ${S.sel.includes(d.code)?'checked':''}><span><b>${d.code}</b> ${esc(d.name)}<br><span class=small>${d.book} &middot; ${n} questions &middot; lifetime ${st.n?Math.round(100*st.s/st.n)+'% of '+st.n+' answered':'not started'}</span></span></label>`}).join('')+'</div>';
  a.querySelectorAll('input').forEach(i=>i.onchange=()=>{S.sel=[...a.querySelectorAll('input:checked')].map(x=>x.dataset.c);save();build();});
  all.onclick=()=>{S.sel=DECKS.map(d=>d.code);save();build();render();};none.onclick=()=>{S.sel=[];save();build();render();};return;}
 if(view==='plan'){a.innerHTML='<div class="card"><b>20-day plan</b><div class=small>Tick a day to load exactly those chapters into Study. ~45-60 min/day. Review days are quiz-only.</div></div>'+
  PLAN.map((p,i)=>`<div class="card"><div class=row><input type=checkbox data-d="${i}" ${S.plan[i]?'checked':''}><b>${p[0]}</b><span class=sp></span><button data-load="${p[2]}">Load these chapters</button></div>
  <div style="margin-top:6px">${esc(p[1])}</div><div class=small>${esc(p[2])}${p[3]?' &mdash; '+esc(p[3]):''}</div></div>`).join('');
  a.querySelectorAll('input').forEach(i=>i.onchange=()=>{S.plan[i.dataset.d]=i.checked;save();});
  a.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{const v=b.dataset.load;S.sel=v==='ALL'?DECKS.map(d=>d.code):v.split(',');save();build();go('study');});return;}
 if(view==='browse'){a.innerHTML='<div class=card><input id=f placeholder="Search questions and answers..." style="width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#10131a;color:var(--fg)"></div><div id=res></div>';
  const draw=t=>{const r=ALL.filter(q=>!t||(q.q+' '+(q.answer||'')+' '+(q.options||[]).join(' ')+q.exp).toLowerCase().includes(t));
   document.getElementById('res').innerHTML=r.map(q=>`<div class=card><span class=pill>${q.deck}</span><div class=q style="margin-top:8px">${esc(q.q)}</div><div class=ans>${esc(q.type==='mc'?q.options[q.answer]:q.answer)}</div><div class=exp>${esc(q.exp)}</div></div>`).join('')||'<div class=card>No match.</div>';};
  draw('');document.getElementById('f').oninput=e=>draw(e.target.value.toLowerCase());return;}
 // study
 if(!pool.length)build();
 const q=pool[idx];
 let h=`<div class=card><div class=row>
  <button data-m="quiz" class="${S.mode==='quiz'?'on':''}">Quiz (multiple choice + written)</button>
  <button data-m="cards" class="${S.mode==='cards'?'on':''}">Flashcards</button>
  <button data-m="write" class="${S.mode==='write'?'on':''}">Written only</button>
  <span class=sp></span><button id=re>Reshuffle</button></div>
  <div class=bar><i style="width:${pool.length?100*idx/pool.length:0}%"></i></div>
  <div class=small>${idx+1} of ${pool.length} &middot; session score ${done?Math.round(100*right/done)+'%':'-'} (${right}/${done})</div></div>`;
 if(!q){a.innerHTML=h+'<div class=card>No questions selected. Go to "Pick chapters".</div>';wire();return;}
 h+=`<div class=card><span class=pill>${q.deck} &middot; ${esc(q.dname)}</span><div class=q style="margin-top:10px">${esc(q.q)}</div>`;
 if(q.type==='mc'&&S.mode==='quiz'){h+=q.options.map((o,i)=>`<button class="opt${shown?(i===q.answer?' correct':(i===shown.pick?' wrong':'')):''}" data-o="${i}">${esc(o)}</button>`).join('');}
 else{h+=`<textarea id=ta placeholder="Say or type your answer from memory, then reveal."></textarea>`;
  if(shown)h+=`<div class=ans><b>Model answer:</b>\n${esc(q.type==='mc'?q.options[q.answer]:q.answer)}</div><div class=row style="margin-top:10px"><button id=gotit>I had it</button><button id=missed>I missed it</button></div>`;
  else h+=`<div class=row style="margin-top:10px"><button id=rev>Reveal answer</button></div>`;}
 if(shown&&q.exp)h+=`<div class=exp>${esc(q.exp)}</div>`;
 if(shown)h+=`<div class=row style="margin-top:12px"><button id=next>Next &rarr;</button></div>`;
 h+='</div>';a.innerHTML=h;wire();}
function score(ok,q){done++;if(ok)right++;const st=S.stats[q.deck]||{s:0,n:0};st.n++;if(ok)st.s++;S.stats[q.deck]=st;save();}
function wire(){const a=document.getElementById('app');
 a.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();build();render();});
 const re=document.getElementById('re');if(re)re.onclick=()=>{build();render();};
 a.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(shown)return;const q=pool[idx];const p=+b.dataset.o;shown={pick:p};score(p===q.answer,q);render();});
 const rev=document.getElementById('rev');if(rev)rev.onclick=()=>{shown={};render();};
 const g=document.getElementById('gotit');if(g)g.onclick=()=>{score(true,pool[idx]);nxt();};
 const m=document.getElementById('missed');if(m)m.onclick=()=>{score(false,pool[idx]);pool.push(pool[idx]);nxt();};
 const n=document.getElementById('next');if(n)n.onclick=nxt;}
function nxt(){idx=(idx+1)%pool.length;shown=false;render();}
build();render();
</script></body></html>
